name: Codex radar

on:
  workflow_dispatch:

concurrency:
  group: codex-radar
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: monitor
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v7

      - name: 从 Infisical 读取应用配置
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: 80078867-4420-404a-b991-c07292b516ff
          oidc-audience: ${{ vars.INFISICAL_OIDC_AUDIENCE }}
          domain: ${{ vars.INFISICAL_DOMAIN }}
          project-slug: tools-secrets
          env-slug: dev
          secret-path: /site-monitor

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run codex radar
        run: uv run python codex_radar.py
