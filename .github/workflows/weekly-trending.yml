name: Weekly GitHub Trending

on:
  workflow_dispatch:
    inputs:
      force:
        description: "忽略本周已发送状态，用于修正后补发"
        required: false
        default: false
        type: boolean

concurrency:
  group: weekly-github-trending
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: monitor
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v7

      - name: 从 Infisical 读取应用配置
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: 80078867-4420-404a-b991-c07292b516ff
          oidc-audience: ${{ vars.INFISICAL_OIDC_AUDIENCE }}
          domain: ${{ vars.INFISICAL_DOMAIN }}
          project-slug: tools-secrets
          env-slug: dev
          secret-path: /site-monitor

      - name: 从 common 读取共享 LLM 配置
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: 80078867-4420-404a-b991-c07292b516ff
          oidc-audience: ${{ vars.INFISICAL_OIDC_AUDIENCE }}
          domain: ${{ vars.INFISICAL_DOMAIN }}
          project-slug: common-shared
          env-slug: dev
          secret-path: /llm/site-monitor

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Install dependencies
        run: uv sync --frozen

      - name: Send weekly Trending
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SITE_MONITOR_FORCE_WEEKLY: ${{ inputs.force && 'true' || 'false' }}
        run: uv run python weekly_trending.py
