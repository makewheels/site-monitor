name: Weekly GitHub Trending

on:
  workflow_dispatch:
    inputs:
      force:
        description: "忽略本周已发送状态，用于修正后补发"
        required: false
        default: false
        type: boolean

concurrency:
  group: weekly-github-trending
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monitor
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Install dependencies
        run: uv sync --frozen

      - name: Send weekly Trending
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SITE_MONITOR_MONGO_URI: ${{ secrets.SITE_MONITOR_MONGO_URI }}
          SITE_MONITOR_DB_NAME: ${{ secrets.SITE_MONITOR_DB_NAME }}
          FEISHU_APP_ID: ${{ vars.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_USER_ID: ${{ secrets.FEISHU_USER_ID }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          SITE_MONITOR_FORCE_WEEKLY: ${{ inputs.force && 'true' || 'false' }}
        run: uv run python weekly_trending.py
