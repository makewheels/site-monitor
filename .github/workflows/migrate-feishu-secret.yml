name: Migrate Feishu secret

on:
  push:
    branches: [chore/infisical-secrets-cutover]

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Copy the existing secret to Infisical
        env:
          INFISICAL_DOMAIN: ${{ vars.INFISICAL_DOMAIN }}
          MIGRATION_CLIENT_ID: ${{ secrets.INFISICAL_MIGRATION_CLIENT_ID }}
          MIGRATION_CLIENT_SECRET: ${{ secrets.INFISICAL_MIGRATION_CLIENT_SECRET }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: |
          set -euo pipefail
          access_token=$(docker run --rm \
            infisical/cli:0.43.121 login \
            --method=universal-auth \
            --client-id="$MIGRATION_CLIENT_ID" \
            --client-secret="$MIGRATION_CLIENT_SECRET" \
            --domain="$INFISICAL_DOMAIN" \
            --plain --silent)
          [ -n "$access_token" ]
          echo "::add-mask::$access_token"
          docker run --rm \
            -e INFISICAL_TOKEN="$access_token" \
            -e INFISICAL_DOMAIN \
            -e FEISHU_APP_SECRET \
            --entrypoint sh infisical/cli:0.43.121 -c '
              set -eu
              infisical secrets set "FEISHU_APP_SECRET=$FEISHU_APP_SECRET" \
                --token="$INFISICAL_TOKEN" \
                --projectId=79c61872-d992-44c7-a5ae-d3e70e004e7f \
                --env=dev \
                --path=/site-monitor \
                --domain="$INFISICAL_DOMAIN" \
                --silent >/dev/null
            '
