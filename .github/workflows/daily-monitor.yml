name: Daily site monitor

on:
  schedule:
    - cron: '0 7 * * *'
      timezone: Asia/Shanghai
  workflow_dispatch:

concurrency:
  group: daily-site-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monitor
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run daily summary
        env:
          SITE_MONITOR_MONGO_URI: ${{ secrets.SITE_MONITOR_MONGO_URI }}
          SITE_MONITOR_DB_NAME: ${{ secrets.SITE_MONITOR_DB_NAME }}
          FEISHU_APP_ID: ${{ vars.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_USER_ID: ${{ secrets.FEISHU_USER_ID }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: |
          set -o pipefail
          uv run python daily_summary.py 2>&1 | tee /tmp/monitor.log
          grep -q "MongoDB 写入成功" /tmp/monitor.log
          grep -q "发送成功 (feishu)" /tmp/monitor.log
