name: Daily site monitor

on:
  workflow_dispatch:

concurrency:
  group: daily-site-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: monitor
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v7

      - name: 从 Infisical 读取应用配置
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: 80078867-4420-404a-b991-c07292b516ff
          oidc-audience: ${{ vars.INFISICAL_OIDC_AUDIENCE }}
          domain: ${{ vars.INFISICAL_DOMAIN }}
          project-slug: tools-secrets
          env-slug: dev
          secret-path: /site-monitor

      - name: 从 common 读取共享 LLM 配置
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: 80078867-4420-404a-b991-c07292b516ff
          oidc-audience: ${{ vars.INFISICAL_OIDC_AUDIENCE }}
          domain: ${{ vars.INFISICAL_DOMAIN }}
          project-slug: common-shared
          env-slug: dev
          secret-path: /llm/site-monitor

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run daily summary
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runner_temp_resolved=$(cd "$RUNNER_TEMP" && pwd -P)
          log_file=$(mktemp "$runner_temp_resolved/site-monitor-daily.XXXXXX")
          cleanup() {
            case "$log_file" in
              "$runner_temp_resolved"/site-monitor-daily.*) [ ! -e "$log_file" ] || unlink "$log_file" ;;
            esac
          }
          trap cleanup EXIT HUP INT TERM
          uv run python daily_summary.py 2>&1 | tee "$log_file"
          grep -q "MongoDB 写入成功" "$log_file"
          grep -q "发送成功 (feishu)" "$log_file"
