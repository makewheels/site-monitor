name: Codex reset watch

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: codex-reset-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: monitor
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v7

      - name: 从 Infisical 读取飞书配置
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: 80078867-4420-404a-b991-c07292b516ff
          oidc-audience: ${{ vars.INFISICAL_OIDC_AUDIENCE }}
          domain: ${{ vars.INFISICAL_DOMAIN }}
          project-slug: tools-secrets
          env-slug: dev
          secret-path: /site-monitor

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Install dependencies
        run: uv sync --frozen

      - name: 检查 Codex 重置公告
        env:
          CODEX_RESET_CHAT_ID: ${{ vars.CODEX_RESET_CHAT_ID }}
        run: uv run python codex_reset.py